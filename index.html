<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Anniversary Card - Strict Boundaries</title>
    <style>
        /* ===== Global Reset ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background-color: #260508; color: #fff; overflow-x: hidden; overflow-y: auto; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; }

        /* ===== Orientation Warning ===== */
        #orientation-warning { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #3b0a0e; z-index: 99999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px; }
        #orientation-warning svg { width: 15%; height: auto; margin-bottom: 20px; animation: bounceIcon 2s infinite ease-in-out; }
        #orientation-warning p { font-size: 1.2rem; color: #f3d5b5; line-height: 1.5; max-width: 300px; }
        @keyframes bounceIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @media screen and (orientation: landscape) { #orientation-warning { display: flex; } .card-container { display: none; } }

        /* ===== Card Container & Screens ===== */
        .card-container { position: relative; width: 100%; max-width: 450px; background-color: #6d1a24; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .screen { position: relative; width: 100%; display: none; opacity: 0; transition: opacity 0.3s ease-in-out; overflow: hidden; }
        .screen.active { display: block; opacity: 1; }
        .bg-reference { width: 100%; height: auto; display: block; pointer-events: none; }

        /* ===== Screen 1 Custom Styling (1080x768 & Solid Red Background) ===== */
        #screen-1 {
            background-color: #6d1a24;
            aspect-ratio: 1080 / 768;
        }

        /* ===== Screen 1 Position & Elements ===== */
        .s1-item-1 { position: absolute; top: 0%; right: 0%; width: 40%; height: auto; z-index: 2; pointer-events: none; }
        .s1-item-2 { position: absolute; top: -15%; left: 0%; width: 82%; height: auto; z-index: 2; pointer-events: none; }
        .s1-item-3 { position: absolute; top: 16.5%; left: 23.3%; width: 52.2%; height: auto; z-index: 3; pointer-events: none; }
        .envelope-target { position: absolute; top: 28%; left: 28%; width: 44%; height: 35%; background: transparent; z-index: 6; cursor: pointer; }
        .s1-item-4 { position: absolute; top: 29.4%; right: -10.7%; width: 53.5%; height: auto; z-index: 4; pointer-events: none; }
        .s1-item-5 { position: absolute; top: 44.5%; left: 13.6%; width: 32%; height: auto; z-index: 4; pointer-events: none; }
        .s1-item-6 { position: absolute; top: 48%; left: 56%; width: 32%; height: auto; z-index: 4; pointer-events: none; }
        .s1-title { position: absolute; top: -11.2%; left: 30.4%; width: 41%; height: auto; z-index: 5; pointer-events: none; }
        .s1-instruction { position: absolute; top: 52.5%; left: 26.3%; width: 49%; height: auto; z-index: 5; pointer-events: none; animation: pulseInstruction 2s infinite ease-in-out; }
        @keyframes pulseInstruction { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

        /* ===== Menu & Navigation ===== */
        .menu-msg     { position: absolute; top: 30%; left: 10%; width: 80%; height: 18%; background: transparent; z-index: 5; cursor: pointer; }
        .menu-moments { position: absolute; top: 51%; left: 10%; width: 80%; height: 18%; background: transparent; z-index: 5; cursor: pointer; }
        .menu-flowers { position: absolute; top: 72%; left: 10%; width: 80%; height: 18%; background: transparent; z-index: 5; cursor: pointer; }
        .s3-item-1    { position: absolute; top: 15%; left: 10%; width: 80%; height: auto; z-index: 2; }
        .s4-item-1    { position: absolute; top: 15%; left: 10%; width: 80%; height: auto; z-index: 2; }
        .s4-item-2    { position: absolute; top: 35%; left: 15%; width: 70%; height: auto; z-index: 2; }
        .s5-item-1    { position: absolute; top: 20%; left: 15%; width: 70%; height: auto; z-index: 2; }
        .back-btn-pos { position: absolute; bottom: 5%; left: 5%; width: 15%; height: auto; cursor: pointer; z-index: 10; }
        .back-btn-pos:hover { opacity: 0.8; }
    </style>
</head>
